<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 75" width="100%" height="75">
  <defs>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be7912">
        <animate attributeName="stop-color" values="#be7912; #e8a63a; #be7912" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f0b34d">
        <animate attributeName="stop-color" values="#f0b34d; #be7912; #f0b34d" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#be7912">
        <animate attributeName="stop-color" values="#be7912; #e8a63a; #be7912" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: url(#goldShimmer);
      text-anchor: middle;
      letter-spacing: 4px;
    }
    .role-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #8f6027;
      text-anchor: middle;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
  <text x="50%" y="38" class="name-title">MURILO CARLUCCI</text>
  <text x="50%" y="62" class="role-subtitle">Infraestrutura de Redes &amp; Segurança Defensiva</text>
</svg>
